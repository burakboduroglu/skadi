<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d1117">
<title>Abonelikler</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --raise: #1c232c; --line: #262d36;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --pos: #3fb950; --neg: #f85149;
    --radius: 14px; --gap: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: var(--gap) var(--gap) 96px; }
  /* The page is a single column with one gap: section spacing comes from here
     and nowhere else, so nothing can drift by a few pixels on its own. */
  #app, #login { display: flex; flex-direction: column; gap: var(--gap); }
  #app.hidden, #login.hidden { display: none !important; }

  h1 { font-size: 19px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  header { display: flex; align-items: center; justify-content: space-between; gap: var(--gap); }

  button {
    background: var(--accent); color: #06111f; border: 0; border-radius: 10px;
    padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer;
    min-height: 44px;
  }
  button:active { transform: scale(.98); }
  button.ghost { background: var(--raise); color: var(--text); font-weight: 500; }
  .hdr-right { display: flex; align-items: center; gap: 8px; position: relative; }
  /* Add is the only action left in the header, and it is muted rather than
     accent-blue so the avatar is what the eye lands on. */
  #addBtn { background: var(--raise); color: var(--text); font-weight: 550; padding: 0 16px; }
  .avatar {
    width: 44px; min-width: 44px; height: 44px; padding: 0; border-radius: 50%;
    background: var(--raise); color: var(--text); border: 1px solid var(--line);
    font-weight: 600; font-size: 15px;
  }
  .avatar[aria-expanded="true"] { border-color: var(--accent); }
  .menu {
    position: absolute; top: 52px; right: 0; z-index: 20; min-width: 172px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 6px; box-shadow: 0 14px 34px #000a;
  }
  .menu button {
    display: block; width: 100%; height: 40px; min-height: 40px; text-align: left;
    background: transparent; color: var(--text); font-weight: 500; border-radius: 8px;
    padding: 0 12px;
  }
  .menu button:hover { background: var(--raise); }
  .menu button.out { color: var(--neg); }
  button.danger { background: transparent; color: var(--neg); border: 1px solid var(--line); font-weight: 500; }

  input, select, textarea {
    /* A fixed height rather than min-height, and appearance:none on all three:
       select and input[type=date] otherwise size themselves from their own
       browser chrome and end up taller than a plain text input. */
    width: 100%; height: 44px; box-sizing: border-box;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    /* 16px keeps iOS Safari from zooming the page on focus. */
    padding: 0 12px; font: inherit; font-size: 16px; line-height: 42px;
    -webkit-appearance: none; appearance: none;
  }
  select {
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 17px) 20px, calc(100% - 12px) 20px;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 32px;
  }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(.6); }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent);
  }
  textarea { height: 88px; line-height: 1.5; padding: 10px 12px; resize: vertical; }
  /* A fixed label box keeps every cell the same height even when one label is
     longer than its neighbour, so paired fields always line up. */
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px;
          font-weight: 500; min-height: 17px; white-space: nowrap;
          overflow: hidden; text-overflow: ellipsis; }
  .field { margin-bottom: var(--gap); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 var(--gap); }
  .grid .field { margin-bottom: var(--gap); }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }

  .totals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: var(--gap); }
  .totals div { text-align: center; }
  .totals span { display: block; font-size: 11px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .totals b { font-size: 21px; font-weight: 650; letter-spacing: -0.02em; }
  @media (max-width: 560px) {
    .totals { grid-template-columns: 1fr 1fr; gap: var(--gap) 4px; }
    .totals b { font-size: 19px; }
  }

  .row {
    display: flex; align-items: center; gap: 13px; padding: 13px var(--gap);
    border-top: 1px solid var(--line); cursor: pointer;
  }
  .row:first-child { border-top: 0; }
  .row:active { background: var(--raise); }
  .row img { width: 38px; height: 38px; border-radius: 9px; flex: none; background: var(--raise); object-fit: cover; }
  .row .meta { flex: 1; min-width: 0; }
  .row .meta b { display: block; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta small { color: var(--muted); font-size: 12.5px; }
  .row .amt { text-align: right; white-space: nowrap; }
  .row .amt b { font-weight: 600; }
  .row .amt small { display: block; color: var(--pos); font-size: 12px; }
  .row.off { opacity: .45; }

  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 0; width: min(560px, calc(100vw - 32px));
    max-height: calc(100dvh - 48px); overflow: hidden;
  }
  dialog::backdrop { background: #000b; backdrop-filter: blur(2px); }
  .dlg-body { padding: var(--gap); overflow-y: auto; max-height: calc(100dvh - 190px); }
  .dlg-foot {
    display: flex; gap: 8px; justify-content: flex-end; padding: var(--gap);
    border-top: 1px solid var(--line); background: var(--panel);
  }
  /* On phones the dialog becomes a bottom sheet: thumb-reachable, full width. */
  @media (max-width: 560px) {
    dialog {
      width: 100vw; max-width: 100vw; margin: 0 0 0 0; position: fixed;
      bottom: 0; left: 0; top: auto; border-radius: 18px 18px 0 0;
      border-bottom: 0; max-height: 92dvh;
    }
    .dlg-body { max-height: calc(92dvh - 150px); }
    .dlg-foot { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
  }

  details { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 12px; }
  summary {
    cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500;
    margin-bottom: 12px; list-style: none; user-select: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }

  .err { color: var(--neg); font-size: 13px; min-height: 18px; }
  .note { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  .empty { padding: 32px 16px; text-align: center; color: var(--muted); }
  .pager { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .pager button { min-width: 44px; height: 38px; padding: 0 12px; background: var(--raise); color: var(--text); font-weight: 500; }
  .pager button:disabled { opacity: .35; cursor: default; }
  .pager span { font-size: 13px; color: var(--muted); min-width: 62px; text-align: center; }
  .hidden { display: none !important; }
  .logo-preview { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .logo-preview img { width: 34px; height: 34px; border-radius: 8px; background: var(--raise); }
</style>
</head>
<body>
<div class="wrap">

  <div id="login" class="panel hidden" style="max-width:400px;margin:12vh auto;padding:var(--gap)">
    <h1>Abonelikler</h1>
    <div class="field"><label>E-posta</label><input id="email" type="email" autocomplete="username"></div>
    <div class="field"><label>Parola</label><input id="password" type="password" autocomplete="current-password"></div>
    <p class="err" id="loginErr"></p>
    <button id="loginBtn" style="width:100%">Giriş</button>
  </div>

  <div id="app" class="hidden">
    <header>
      <h1>Abonelikler</h1>
      <div class="hdr-right">
        <button id="addBtn">+ Ekle</button>
        <button class="avatar" id="avatarBtn" aria-haspopup="menu" aria-expanded="false"></button>
        <div class="menu hidden" id="menu" role="menu">
          <button id="cardsBtn">Kartlar</button>
          <button id="dashBtn">Dashboard</button>
          <button id="logoutBtn" class="out">Çıkış</button>
        </div>
      </div>
    </header>

    <div class="panel totals">
      <div><span>Aylık brüt</span><b id="tGross">—</b></div>
      <div><span>Cashback</span><b id="tCash" style="color:var(--pos)">—</b></div>
      <div><span>Aylık net</span><b id="tNet">—</b></div>
      <div><span>Yıllık net</span><b id="tYear">—</b></div>
    </div>
    <p class="note" id="fxNote" style="margin:0 4px"></p>

    <div class="panel" id="list"></div>
    <div class="pager hidden" id="pager">
      <button id="prevBtn">‹</button><span id="pageInfo"></span><button id="nextBtn">›</button>
    </div>
  </div>
</div>

<dialog id="dlg">
  <div class="dlg-body">
    <h1 id="dlgTitle" style="margin-bottom:var(--gap)">Yeni abonelik</h1>

    <div class="grid">
      <div class="field"><label>Link</label>
        <input id="f_vendor_url" inputmode="url"></div>
      <div class="field"><label>Ad</label>
        <input id="f_name"></div>

      <div class="field"><label>Tutar</label>
        <input id="f_amount" type="number" inputmode="decimal" step="0.01" min="0"></div>
      <div class="field"><label>Birim</label><select id="f_currency">
        <option>TRY</option><option>USD</option><option>EUR</option><option>GBP</option></select></div>

      <div class="field"><label>Periyot</label><select id="f_cycle">
        <option value="monthly">Aylık</option><option value="yearly">Yıllık</option>
        <option value="quarterly">3 aylık</option><option value="weekly">Haftalık</option></select></div>
      <div class="field"><label>Tarih</label>
        <input id="f_next_charge" type="date"></div>

      <div class="field"><label>Cashback</label>
        <input id="f_cashback" type="number" inputmode="decimal" step="0.01" min="0"></div>
      <div class="field"><label>Kart</label>
        <select id="f_payment_method"></select></div>

      <div class="field"><label>Kategori</label><select id="f_category">
        <option value="">—</option><option>Yazılım</option><option>Medya</option><option>Oyun</option>
        <option>Bulut</option><option>Finans</option><option>Sağlık</option><option>Eğitim</option>
        <option>Diğer</option></select></div>
      <div class="field"><label>Durum</label><select id="f_status">
        <option value="active">Aktif</option><option value="paused">Duraklatıldı</option>
        <option value="cancelled">İptal</option></select></div>
    </div>

    <div class="field"><label>Not</label><textarea id="f_notes" rows="2"></textarea></div>

    <div class="logo-preview hidden" id="logoPreview">
      <img id="logoImg" alt="">
    </div>
    <p class="err" id="dlgErr"></p>
  </div>

  <div class="dlg-foot">
    <button class="danger hidden" id="delBtn">Sil</button>
    <button class="ghost" id="cancelBtn">Vazgeç</button>
    <button id="saveBtn">Kaydet</button>
  </div>
</dialog>

<dialog id="cardsDlg">
  <div class="dlg-body">
    <h1 style="margin-bottom:var(--gap)">Kartlar</h1>
    <div class="panel" id="cardList"></div>
    <div class="field" style="margin-top:var(--gap)"><label>Yeni</label><input id="f_newcard"></div>
    <p class="err" id="cardsErr"></p>
  </div>
  <div class="dlg-foot">
    <button class="ghost" id="cardsClose">Kapat</button>
    <button id="cardAdd">Ekle</button>
  </div>
</dialog>

<script>
const API = location.origin
const COL = API + "/api/collections/subscriptions/records"
const CARDS = API + "/api/collections/cards/records"
// logo_url is derived from the link on the server and has no input of its own.
const FIELDS = ["name","amount","currency","cashback","cycle","next_charge",
                "status","category","payment_method","vendor_url","notes"]
const CYCLE_MONTHS = { weekly: 12/52, monthly: 1, quarterly: 3, yearly: 12 }
const CYCLE_TR = { weekly: "haftalık", monthly: "aylık", quarterly: "3 aylık", yearly: "yıllık" }

let token = localStorage.getItem("subs_token") || ""
let items = []
let fx = null          // TRY per one unit of each currency, or null when unavailable
let editing = null
let fxMeta = { date: null, stale: false }
const PER_PAGE = 8
let page = 1
let cards = []

const $ = id => document.getElementById(id)
const fmt = n => new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 0 }).format(n)

// Every field below reaches innerHTML, and `name` can arrive from a Google Play
// listing's og:title rather than from this browser. Unescaped, a crafted title
// would run script on this origin - where a superuser token sits in
// localStorage. Escape at the point of interpolation, without exception.
const ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ESCAPES[c])

async function api(url, opts = {}) {
  const res = await fetch(url, {
    ...opts,
    headers: { "Content-Type": "application/json", "Authorization": token, ...(opts.headers || {}) }
  })
  if (res.status === 401 || res.status === 403) { logout(); throw new Error("Oturum düştü") }
  const body = res.status === 204 ? null : await res.json()
  if (!res.ok) throw new Error(body?.message || ("HTTP " + res.status))
  return body
}

function logout() {
  token = ""
  localStorage.removeItem("subs_token")
  $("app").classList.add("hidden")
  $("login").classList.remove("hidden")
}

async function login() {
  $("loginErr").textContent = ""
  try {
    const res = await fetch(API + "/api/collections/_superusers/auth-with-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ identity: $("email").value.trim(), password: $("password").value })
    })
    const body = await res.json()
    if (!res.ok) throw new Error(body?.message || "Giriş başarısız")
    token = body.token
    localStorage.setItem("subs_token", token)
    // Kept only to draw the avatar's initial; the token is what authenticates.
    localStorage.setItem("subs_email", $("email").value.trim())
    $("password").value = ""
    start()
  } catch (err) {
    // The edge rate-limits /api/collections/_superusers* at 5 requests per 10s,
    // so a burst of retries looks like a credential failure. Say so.
    $("loginErr").textContent = err.message + " (art arda denediysen 10 sn bekle)"
  }
}

// Rates come from our own /api/subs/rates, not from the browser reaching an FX
// API directly: Yahoo sends no CORS headers, and a second source would let this
// page and the dashboard disagree about the same total. The same call rolls any
// passed charge date forward, which is why it runs before the list loads.
async function loadFx() {
  try {
    const body = await api(API + "/api/subs/rates")
    fx = body.rates
    fxMeta = { date: body.date || null, stale: !!body.stale }
  } catch (err) {
    fx = null
    fxMeta = { date: null, stale: true }
  }
}

const rate = n => new Intl.NumberFormat("tr-TR", { minimumFractionDigits: 2,
                                                  maximumFractionDigits: 2 }).format(n)

// The rates themselves, not just their provenance: seeing 48,44 is what tells
// you whether a total looks right.
function renderFx(unknown) {
  if (!fx) {
    $("fxNote").textContent = "Kur alınamadı — yabancı para tutarları toplama dahil edilmedi."
    return
  }
  const parts = ["USD", "EUR", "GBP"].filter(c => fx[c]).map(c => `${c} ${rate(fx[c])} ₺`)
  if (fxMeta.date) parts.push(fxMeta.date)
  if (fxMeta.stale) parts.push("güncellenemedi, son bilinen kur")
  if (unknown) parts.push(`${unknown} kayıt kur olmadığı için toplama girmedi`)
  $("fxNote").textContent = parts.join("  ·  ")
}

// Rates are TRY per one unit of the currency.
const toTRY = (amount, cur) =>
  cur === "TRY" ? amount : (fx && fx[cur] ? amount * fx[cur] : null)

async function loadCards() {
  const body = await api(CARDS + "?perPage=200&sort=name")
  cards = body.items
  fillCardSelect()
  renderCards()
}

// The select is rebuilt from the collection, so a card renamed in one place
// cannot linger as a stale spelling in the other.
function fillCardSelect(keep) {
  const sel = $("f_payment_method")
  sel.innerHTML = `<option value="">—</option>` +
    cards.map(c => `<option>${esc(c.name)}</option>`).join("")
  if (keep) {
    // A value saved before this card list existed still has to be selectable.
    if (!cards.some(c => c.name === keep)) {
      sel.insertAdjacentHTML("beforeend", `<option>${esc(keep)}</option>`)
    }
    sel.value = keep
  }
}

function renderCards() {
  $("cardList").innerHTML = cards.length
    ? cards.map(c => `<div class="row" data-card="${esc(c.id)}">
        <div class="meta"><b>${esc(c.name)}</b></div>
        <button class="danger" data-del="${esc(c.id)}">Sil</button>
      </div>`).join("")
    : `<p class="empty">Kart yok.</p>`
  $("cardList").querySelectorAll("[data-del]").forEach(b =>
    b.onclick = () => removeCard(b.dataset.del))
}

async function addCard() {
  const name = $("f_newcard").value.trim()
  $("cardsErr").textContent = ""
  if (!name) return
  try {
    await api(CARDS, { method: "POST", body: JSON.stringify({ name }) })
    $("f_newcard").value = ""
    await loadCards()
  } catch (err) {
    $("cardsErr").textContent = /unique|validation/i.test(err.message)
      ? "Bu isimde bir kart zaten var." : err.message
  }
}

async function removeCard(id) {
  const card = cards.find(c => c.id === id)
  // Removing a card leaves it on the subscriptions that already carry it: the
  // field is text, and silently blanking a payment method would lose data.
  const used = items.filter(i => i.payment_method === (card && card.name)).length
  const warn = used ? `\n\n${used} abonelikte kayıtlı; onlarda yazılı kalır.` : ""
  if (!confirm(`"${card ? card.name : id}" silinsin mi?${warn}`)) return
  try {
    await api(`${CARDS}/${id}`, { method: "DELETE" })
    await loadCards()
  } catch (err) {
    $("cardsErr").textContent = err.message
  }
}

function render() {
  let gross = 0, cash = 0, unknown = 0

  // Totals are computed over every subscription, not over the visible page -
  // a monthly cost that changes when you turn the page would be worthless.
  for (const s of items) {
    if (s.status !== "active") continue
    const amtTRY = toTRY(s.amount, s.currency)
    if (amtTRY === null) { unknown++; continue }
    const per = CYCLE_MONTHS[s.cycle] || 1
    gross += amtTRY / per
    cash += (toTRY(s.cashback || 0, s.currency) || 0) / per
  }

  const pages = Math.max(1, Math.ceil(items.length / PER_PAGE))
  if (page > pages) page = pages
  const visible = items.slice((page - 1) * PER_PAGE, page * PER_PAGE)

  const html = visible.map(s => {
    const logo = s.logo_url
      ? `<img src="${esc(s.logo_url)}" alt="" loading="lazy" onerror="this.removeAttribute('src')">`
      : `<img alt="">`
    const sub = [CYCLE_TR[s.cycle], s.next_charge ? s.next_charge.substring(0,10) : null,
                 s.payment_method, s.category].filter(Boolean).map(esc).join(" · ")
    const cb = s.cashback ? `<small>−${fmt(s.cashback)} cashback</small>` : ""
    return `<div class="row ${s.status !== "active" ? "off" : ""}" data-id="${esc(s.id)}">
      ${logo}
      <div class="meta"><b>${esc(s.name)}</b><small>${sub}</small></div>
      <div class="amt"><b>${fmt(s.amount)} ${esc(s.currency)}</b>${cb}</div>
    </div>`
  }).join("")

  $("list").innerHTML = html || `<p class="empty">Henüz kayıt yok.<br>Üstteki <b>+ Ekle</b> ile başla.</p>`
  $("list").querySelectorAll(".row").forEach(el =>
    el.onclick = () => openDialog(items.find(i => i.id === el.dataset.id)))

  $("tGross").textContent = fmt(gross) + " ₺"
  $("tCash").textContent = cash ? "−" + fmt(cash) + " ₺" : "—"
  $("tNet").textContent = fmt(gross - cash) + " ₺"
  $("tYear").textContent = fmt((gross - cash) * 12) + " ₺"
  renderFx(unknown)

  $("pager").classList.toggle("hidden", pages < 2)
  $("pageInfo").textContent = `${page} / ${pages}`
  $("prevBtn").disabled = page <= 1
  $("nextBtn").disabled = page >= pages
}

function turnPage(delta) {
  page += delta
  render()
  window.scrollTo({ top: 0, behavior: "smooth" })
}

function openDialog(item) {
  editing = item || null
  $("dlgTitle").textContent = item ? "Düzenle" : "Yeni abonelik"
  $("delBtn").classList.toggle("hidden", !item)
  $("dlgErr").textContent = ""
  for (const f of FIELDS) {
    const el = $("f_" + f)
    let v = item ? (item[f] ?? "") : ""
    if (f === "next_charge" && v) v = String(v).substring(0, 10)
    if (!item) {
      if (f === "status") v = "active"
      if (f === "cycle") v = "monthly"
      if (f === "currency") v = "TRY"
    }
    if (f === "payment_method") fillCardSelect(v)
    else el.value = v
  }

  const logo = item && item.logo_url
  $("logoPreview").classList.toggle("hidden", !logo)
  if (logo) $("logoImg").src = logo

  $("dlg").showModal()
  if (!item) setTimeout(() => $("f_vendor_url").focus(), 60)
}

async function save() {
  $("dlgErr").textContent = ""
  const data = {}
  for (const f of FIELDS) data[f] = $("f_" + f).value
  data.amount = parseFloat(data.amount || 0)
  data.cashback = parseFloat(data.cashback || 0)

  // Name may be blank when a Play link can supply it; the server fills it in.
  const playLink = data.vendor_url.indexOf("play.google.com") !== -1
  if (!data.name && !playLink) { $("dlgErr").textContent = "Ad gerekli (ya da bir Play linki ver)."; return }
  if (!data.next_charge) { $("dlgErr").textContent = "Sonraki ödeme tarihi gerekli."; return }
  if (!data.amount) { $("dlgErr").textContent = "Tutar gerekli."; return }

  $("saveBtn").disabled = true
  $("saveBtn").textContent = playLink && !data.name ? "Çekiliyor…" : "Kaydediliyor…"
  try {
    await api(editing ? `${COL}/${editing.id}` : COL, {
      method: editing ? "PATCH" : "POST",
      body: JSON.stringify(data)
    })
    $("dlg").close()
    await load()
  } catch (err) {
    $("dlgErr").textContent = err.message
  } finally {
    $("saveBtn").disabled = false
    $("saveBtn").textContent = "Kaydet"
  }
}

async function remove() {
  if (!editing || !confirm(`"${editing.name}" silinsin mi?`)) return
  try {
    await api(`${COL}/${editing.id}`, { method: "DELETE" })
    $("dlg").close()
    await load()
  } catch (err) {
    $("dlgErr").textContent = err.message
  }
}

async function load() {
  const body = await api(COL + "?perPage=500&sort=status,next_charge")
  items = body.items
  render()
}

async function start() {
  $("login").classList.add("hidden")
  $("app").classList.remove("hidden")
  $("list").innerHTML = `<p class="empty">Yükleniyor…</p>`

  await loadFx()
  try { await loadCards() } catch (err) { console.error(err) }

  // A failed load used to leave an empty panel and put the reason in the
  // console, which reads as "my data is gone". Say what happened instead.
  try {
    await load()
  } catch (err) {
    console.error(err)
    $("list").innerHTML =
      `<p class="empty">Liste yüklenemedi.<br><b>${esc(err.message)}</b>` +
      `<br><br><button id="retryBtn">Tekrar dene</button></p>`
    const retry = $("retryBtn")
    if (retry) retry.onclick = () => start()
  }
  // ?add=1 is how the Glance widget's "+ Ekle" link lands straight on the form.
  if (new URLSearchParams(location.search).get("add")) {
    history.replaceState(null, "", location.pathname)
    openDialog(null)
  }
}

$("loginBtn").onclick = login
$("password").onkeydown = e => { if (e.key === "Enter") login() }
$("logoutBtn").onclick = logout
$("addBtn").onclick = () => openDialog(null)
$("saveBtn").onclick = save
$("delBtn").onclick = remove
$("cancelBtn").onclick = () => $("dlg").close()
$("cardsBtn").onclick = () => { $("cardsErr").textContent = ""; $("cardsDlg").showModal() }
$("cardsClose").onclick = () => { $("cardsDlg").close(); fillCardSelect($("f_payment_method").value) }
$("cardAdd").onclick = addCard

const menu = $("menu")
const closeMenu = () => {
  menu.classList.add("hidden")
  $("avatarBtn").setAttribute("aria-expanded", "false")
}
$("avatarBtn").onclick = (e) => {
  e.stopPropagation()
  const open = menu.classList.toggle("hidden")
  $("avatarBtn").setAttribute("aria-expanded", open ? "false" : "true")
}
document.addEventListener("click", closeMenu)
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu() })
menu.querySelectorAll("button").forEach(b => b.addEventListener("click", closeMenu))

// A session that predates the stored address has no initial to show, so fall
// back to a glyph rather than rendering a literal question mark.
const initial = (localStorage.getItem("subs_email") || "").trim().charAt(0).toUpperCase()
$("avatarBtn").innerHTML = initial ||
  `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" style="vertical-align:-3px">
     <circle cx="12" cy="8" r="3.5"></circle>
     <path d="M4.5 20c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6"></path>
   </svg>`
$("dashBtn").onclick = () => location.href = "https://glance.burakboduroglu.com.tr/"
$("prevBtn").onclick = () => turnPage(-1)
$("nextBtn").onclick = () => turnPage(1)
$("f_newcard").onkeydown = e => { if (e.key === "Enter") addCard() }

// Live preview, so a pasted image URL is confirmed before saving rather than
// after - a broken link is otherwise only visible once it is already stored.
function previewLogo() {
  const url = $("f_vendor_url").value.trim()
  // Only a direct image can be previewed here; a page URL is resolved server
  // side on save, so there is nothing honest to show for it yet.
  const isImage = /\.(png|jpe?g|webp|svg|gif|avif)(\?|#|$)/i.test(url) && !/File:/i.test(url)
  if (isImage) { $("logoImg").src = url; $("logoPreview").classList.remove("hidden") }
}
$("f_vendor_url").oninput = previewLogo

if (token) start(); else $("login").classList.remove("hidden")
</script>
</body>
