<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d1117">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2358a6ff'/%3E%3Crect x='6' y='9' width='20' height='14' rx='3' fill='%230d1117'/%3E%3Crect x='6' y='13' width='20' height='3' fill='%2358a6ff'/%3E%3Crect x='9' y='18' width='7' height='2.5' rx='1.25' fill='%2358a6ff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2358a6ff'/%3E%3Crect x='6' y='9' width='20' height='14' rx='3' fill='%230d1117'/%3E%3Crect x='6' y='13' width='20' height='3' fill='%2358a6ff'/%3E%3Crect x='9' y='18' width='7' height='2.5' rx='1.25' fill='%2358a6ff'/%3E%3C/svg%3E">
<title>Abonelikler</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --raise: #1c232c; --line: #262d36;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --pos: #3fb950; --neg: #f85149;
    --radius: 14px; --gap: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: var(--gap) var(--gap) 96px; }
  /* The page is a single column with one gap: section spacing comes from here
     and nowhere else, so nothing can drift by a few pixels on its own. */
  #app, #login { display: flex; flex-direction: column; gap: var(--gap); }
  #app.hidden, #login.hidden { display: none !important; }

  h1 { font-size: 19px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  header { display: flex; align-items: center; justify-content: space-between; gap: var(--gap); }

  button {
    background: var(--accent); color: #06111f; border: 0; border-radius: 10px;
    padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer;
    min-height: 44px;
  }
  button:active { transform: scale(.98); }
  button.ghost { background: var(--raise); color: var(--text); font-weight: 500; }
  .hdr-right { display: flex; align-items: center; gap: 8px; position: relative; }
  /* Add is the only action left in the header, and it is muted rather than
     accent-blue so the avatar is what the eye lands on. */
  #addBtn { background: var(--raise); color: var(--text); font-weight: 550; padding: 0 16px; }
  .avatar {
    width: 44px; min-width: 44px; height: 44px; padding: 0; border-radius: 50%;
    background: var(--raise); color: var(--text); border: 1px solid var(--line);
    font-weight: 600; font-size: 15px;
  }
  .avatar[aria-expanded="true"] { border-color: var(--accent); }
  .menu {
    position: absolute; top: 52px; right: 0; z-index: 20; min-width: 172px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 6px; box-shadow: 0 14px 34px #000a;
  }
  .menu button {
    display: flex; align-items: center; gap: 10px;
    width: 100%; height: 40px; min-height: 40px; text-align: left;
    background: transparent; color: var(--text); font-weight: 500; border-radius: 8px;
    padding: 0 12px;
  }
  .menu svg { width: 17px; height: 17px; flex: none; opacity: .8; }
  .menu button:hover { background: var(--raise); }
  .menu button.out { color: var(--neg); }
  .menu-sep { height: 1px; background: var(--line); margin: 6px 4px; }
  /* A grid, not flex: both rows share one column track, so the language and
     display selects are the same width whatever their longest option says. */
  .menu-row {
    display: grid; grid-template-columns: 1fr 118px; align-items: center; gap: 10px;
    padding: 5px 12px; font-size: 13px; color: var(--muted);
  }
  .menu-row select {
    width: 118px; height: 32px; line-height: 30px; font-size: 13px;
    padding: 0 26px 0 8px; background-position: calc(100% - 14px) 14px, calc(100% - 9px) 14px;
  }
  button.danger { background: transparent; color: var(--neg); border: 1px solid var(--line); font-weight: 500; }

  input, select, textarea {
    /* A fixed height rather than min-height, and appearance:none on all three:
       select and input[type=date] otherwise size themselves from their own
       browser chrome and end up taller than a plain text input. */
    width: 100%; height: 44px; box-sizing: border-box;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    /* 16px keeps iOS Safari from zooming the page on focus. */
    padding: 0 12px; font: inherit; font-size: 16px; line-height: 42px;
    -webkit-appearance: none; appearance: none;
  }
  select {
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 17px) 20px, calc(100% - 12px) 20px;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 32px;
  }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(.6); }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent);
  }
  textarea { height: 88px; line-height: 1.5; padding: 10px 12px; resize: vertical; }
  /* A fixed label box keeps every cell the same height even when one label is
     longer than its neighbour, so paired fields always line up. */
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px;
          font-weight: 500; min-height: 17px; white-space: nowrap;
          overflow: hidden; text-overflow: ellipsis; }
  .field { margin-bottom: var(--gap); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 var(--gap); }
  .grid .field { margin-bottom: var(--gap); }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }

  .totals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: var(--gap); }
  .totals div { text-align: center; }
  .totals span { display: block; font-size: 11px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .totals b { font-size: 21px; font-weight: 650; letter-spacing: -0.02em; }
  @media (max-width: 560px) {
    .totals { grid-template-columns: 1fr 1fr; gap: var(--gap) 4px; }
    .totals b { font-size: 19px; }
  }

  .row {
    display: flex; align-items: center; gap: 13px; padding: 13px var(--gap);
    border-top: 1px solid var(--line); cursor: pointer;
  }
  .row:first-child { border-top: 0; }
  .row:active { background: var(--raise); }
  /* contain, not cover: a wide vendor logo squeezed into a square box is
     stretched, and cropped to fit is worse - it eats the wordmark. */
  .row img { width: 38px; height: 38px; border-radius: 9px; flex: none;
             background: var(--raise); object-fit: contain; padding: 3px; }
  .row .meta { flex: 1; min-width: 0; }
  .row .meta b { display: block; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta small { color: var(--muted); font-size: 12.5px; }
  .row .amt { text-align: right; white-space: nowrap; }
  .row .amt b { font-weight: 600; }
  .row .amt small { display: block; color: var(--pos); font-size: 12px; }
  .row.off { opacity: .45; }

  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 0; width: min(560px, calc(100vw - 32px));
    max-height: calc(100dvh - 48px); overflow: hidden;
  }
  dialog::backdrop { background: #000b; backdrop-filter: blur(2px); }
  .dlg-body { padding: var(--gap); overflow-y: auto; max-height: calc(100dvh - 190px); }
  .dlg-foot {
    display: flex; gap: 8px; justify-content: flex-end; padding: var(--gap);
    border-top: 1px solid var(--line); background: var(--panel);
  }
  /* On phones the dialog becomes a bottom sheet: thumb-reachable, full width. */
  @media (max-width: 560px) {
    dialog {
      width: 100vw; max-width: 100vw; margin: 0 0 0 0; position: fixed;
      bottom: 0; left: 0; top: auto; border-radius: 18px 18px 0 0;
      border-bottom: 0; max-height: 92dvh;
    }
    .dlg-body { max-height: calc(92dvh - 150px); }
    .dlg-foot { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
  }

  details { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 12px; }
  summary {
    cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500;
    margin-bottom: 12px; list-style: none; user-select: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }

  .err { color: var(--neg); font-size: 13px; min-height: 18px; }
  .note { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  .empty { padding: 32px 16px; text-align: center; color: var(--muted); }
  .fxbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px var(--gap); font-size: 13px;
  }
  .fxbar .fx {
    display: inline-flex; align-items: baseline; gap: 6px;
    background: var(--raise); border-radius: 8px; padding: 5px 10px;
  }
  .fxbar .sym { color: var(--muted); font-weight: 600; }
  .fxbar .dot { color: var(--muted); opacity: .6; }
  .fxbar .val { font-weight: 600; font-variant-numeric: tabular-nums; }
  .fxbar .meta { margin-left: auto; color: var(--muted); font-size: 12px; }
  .fxbar .warn { color: var(--neg); }
  .pager { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .pager button { min-width: 44px; height: 38px; padding: 0 12px; background: var(--raise); color: var(--text); font-weight: 500; }
  .pager button:disabled { opacity: .35; cursor: default; }
  .pager span { font-size: 13px; color: var(--muted); min-width: 62px; text-align: center; }
  .hidden { display: none !important; }
  .logo-preview { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .logo-preview img { width: 34px; height: 34px; border-radius: 8px;
                      background: var(--raise); object-fit: contain; padding: 3px; }
</style>
</head>
<body>
<div class="wrap">

  <div id="login" class="panel hidden" style="max-width:400px;margin:12vh auto;padding:var(--gap)">
    <h1 data-i18n="app">Abonelikler</h1>
    <div class="field"><label data-i18n="email">E-posta</label><input id="email" type="email" autocomplete="username"></div>
    <div class="field"><label data-i18n="password">Parola</label><input id="password" type="password" autocomplete="current-password"></div>
    <p class="err" id="loginErr"></p>
    <button id="loginBtn" style="width:100%" data-i18n="login">Giriş</button>
  </div>

  <div id="app" class="hidden">
    <header>
      <h1 data-i18n="app">Abonelikler</h1>
      <div class="hdr-right">
        <button id="addBtn" data-i18n="add">+ Ekle</button>
        <button class="avatar" id="avatarBtn" aria-haspopup="menu" aria-expanded="false"></button>
        <div class="menu hidden" id="menu" role="menu">
          <button id="cardsBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="5" width="20" height="14" rx="2.5"></rect>
              <path d="M2 10h20"></path><path d="M6 15h4"></path>
            </svg><span data-i18n="cards">Kartlar</span></button>
          <button id="dashBtn" class="hidden">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7.5" height="9" rx="1.5"></rect>
              <rect x="13.5" y="3" width="7.5" height="5" rx="1.5"></rect>
              <rect x="3" y="15" width="7.5" height="6" rx="1.5"></rect>
              <rect x="13.5" y="11" width="7.5" height="10" rx="1.5"></rect>
            </svg><span data-i18n="glance">Glance</span></button>
          <button id="logoutBtn" class="out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 17l5-5-5-5"></path><path d="M20 12H9"></path>
              <path d="M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5"></path>
            </svg><span data-i18n="logout">Çıkış</span></button>

          <div class="menu-sep"></div>
          <label class="menu-row"><span data-i18n="lang">Dil</span>
            <select id="langSel"><option value="tr">Türkçe</option><option value="en">English</option></select></label>
          <label class="menu-row"><span data-i18n="display">Görünüm</span>
            <select id="baseSel">
              <option value="TRY">₺ TRY</option><option value="USD">$ USD</option>
              <option value="EUR">€ EUR</option><option value="GBP">£ GBP</option></select></label>
        </div>
      </div>
    </header>

    <div class="panel totals">
      <div><span data-i18n="gross">Aylık brüt</span><b id="tGross">—</b></div>
      <div><span data-i18n="cashback">Cashback</span><b id="tCash" style="color:var(--pos)">—</b></div>
      <div><span data-i18n="net">Aylık net</span><b id="tNet">—</b></div>
      <div><span data-i18n="yearly">Yıllık net</span><b id="tYear">—</b></div>
    </div>
    <div class="panel fxbar" id="fxNote"></div>

    <div class="panel" id="list"></div>
    <div class="pager hidden" id="pager">
      <button id="prevBtn">‹</button><span id="pageInfo"></span><button id="nextBtn">›</button>
    </div>
  </div>
</div>

<dialog id="dlg">
  <div class="dlg-body">
    <h1 id="dlgTitle" style="margin-bottom:var(--gap)">Yeni abonelik</h1>

    <div class="grid">
      <div class="field"><label data-i18n="f_link">Link</label>
        <input id="f_vendor_url" inputmode="url"></div>
      <div class="field"><label data-i18n="f_name">Ad</label>
        <input id="f_name"></div>

      <div class="field"><label data-i18n="f_amount">Tutar</label>
        <input id="f_amount" type="number" inputmode="decimal" step="0.01" min="0"></div>
      <div class="field"><label data-i18n="f_unit">Birim</label><select id="f_currency">
        <option>TRY</option><option>USD</option><option>EUR</option><option>GBP</option></select></div>

      <div class="field"><label data-i18n="f_cycle">Periyot</label><select id="f_cycle">
        <option value="monthly" data-i18n="c_monthly">Aylık</option>
        <option value="yearly" data-i18n="c_yearly">Yıllık</option>
        <option value="quarterly" data-i18n="c_quarterly">3 aylık</option>
        <option value="weekly" data-i18n="c_weekly">Haftalık</option></select></div>
      <div class="field"><label data-i18n="f_date">Tarih</label>
        <input id="f_next_charge" type="date"></div>

      <div class="field"><label data-i18n="f_cashbackF">Cashback</label>
        <input id="f_cashback" type="number" inputmode="decimal" step="0.01" min="0"></div>
      <div class="field"><label data-i18n="f_card">Kart</label>
        <select id="f_payment_method"></select></div>

      <div class="field"><label data-i18n="f_category">Kategori</label><select id="f_category">
        <option value="">—</option>
        <option value="Yazılım" data-i18n="k_software">Yazılım</option>
        <option value="Medya" data-i18n="k_media">Medya</option>
        <option value="Oyun" data-i18n="k_games">Oyun</option>
        <option value="Bulut" data-i18n="k_cloud">Bulut</option>
        <option value="Finans" data-i18n="k_finance">Finans</option>
        <option value="Sağlık" data-i18n="k_health">Sağlık</option>
        <option value="Eğitim" data-i18n="k_learning">Eğitim</option>
        <option value="Diğer" data-i18n="k_other">Diğer</option></select></div>
      <div class="field"><label data-i18n="f_status">Durum</label><select id="f_status">
        <option value="active" data-i18n="s_active">Aktif</option>
        <option value="paused" data-i18n="s_paused">Duraklatıldı</option>
        <option value="cancelled" data-i18n="s_cancelled">İptal</option></select></div>
    </div>

    <div class="field"><label data-i18n="f_notes">Not</label><textarea id="f_notes" rows="2"></textarea></div>

    <div class="logo-preview hidden" id="logoPreview">
      <img id="logoImg" alt="">
    </div>
    <p class="err" id="dlgErr"></p>
  </div>

  <div class="dlg-foot">
    <button class="danger hidden" id="delBtn" data-i18n="del">Sil</button>
    <button class="ghost" id="cancelBtn" data-i18n="cancel">Vazgeç</button>
    <button id="saveBtn" data-i18n="save">Kaydet</button>
  </div>
</dialog>

<dialog id="cardsDlg">
  <div class="dlg-body">
    <h1 style="margin-bottom:var(--gap)" data-i18n="cards">Kartlar</h1>
    <div class="panel" id="cardList"></div>
    <div class="field" style="margin-top:var(--gap)"><label data-i18n="new">Yeni</label><input id="f_newcard"></div>
    <p class="err" id="cardsErr"></p>
  </div>
  <div class="dlg-foot">
    <button class="ghost" id="cardsClose" data-i18n="close">Kapat</button>
    <button id="cardAdd" data-i18n="addShort">Ekle</button>
  </div>
</dialog>

<script>
const API = location.origin
const COL = API + "/api/collections/subscriptions/records"
const CARDS = API + "/api/collections/cards/records"
// logo_url is derived from the link on the server and has no input of its own.
const FIELDS = ["name","amount","currency","cashback","cycle","next_charge",
                "status","category","payment_method","vendor_url","notes"]
const CYCLE_MONTHS = { weekly: 12/52, monthly: 1, quarterly: 3, yearly: 12 }
const cycleName = c => t("c_" + c) || c

// Category values are stored in Turkish because they are data. The select
// translates its option text; the list has to translate the stored value back
// the same way, or an English UI prints "Medya" in the subtitle.
const CATEGORY_KEY = {
  "Yazılım": "k_software", "Medya": "k_media", "Oyun": "k_games", "Bulut": "k_cloud",
  "Finans": "k_finance", "Sağlık": "k_health", "Eğitim": "k_learning", "Diğer": "k_other"
}
const categoryName = c => (c && CATEGORY_KEY[c]) ? t(CATEGORY_KEY[c]) : c


// Two dictionaries and one lookup - no i18n runtime for a page this size.
// Category *values* stay Turkish because they are stored data; only their
// visible text is translated, which is why the option elements carry a value.
const I18N = {
  tr: {
    app: "Abonelikler", email: "E-posta", password: "Parola", login: "Giriş",
    add: "+ Ekle", addShort: "Ekle", cards: "Kartlar", glance: "Glance", logout: "Çıkış",
    lang: "Dil", display: "Görünüm",
    gross: "Aylık brüt", cashback: "Cashback", net: "Aylık net", yearly: "Yıllık net",
    f_link: "Link", f_name: "Ad", f_amount: "Tutar", f_unit: "Birim", f_cycle: "Periyot",
    f_date: "Tarih", f_cashbackF: "Cashback", f_card: "Kart", f_category: "Kategori",
    f_status: "Durum", f_notes: "Not",
    c_monthly: "Aylık", c_yearly: "Yıllık", c_quarterly: "3 aylık", c_weekly: "Haftalık",
    s_active: "Aktif", s_paused: "Duraklatıldı", s_cancelled: "İptal",
    k_software: "Yazılım", k_media: "Medya", k_games: "Oyun", k_cloud: "Bulut",
    k_finance: "Finans", k_health: "Sağlık", k_learning: "Eğitim", k_other: "Diğer",
    save: "Kaydet", cancel: "Vazgeç", del: "Sil", close: "Kapat", new: "Yeni",
    titleNew: "Yeni abonelik", titleEdit: "Düzenle",
    saving: "Kaydediliyor…", fetching: "Çekiliyor…", loading: "Yükleniyor…",
    emptyList: "Henüz kayıt yok.", emptyHint: "ile başla.",
    loadFailed: "Liste yüklenemedi.", retry: "Tekrar dene",
    noCards: "Kart yok.", cardExists: "Bu isimde bir kart zaten var.",
    cardUsed: "abonelikte kayıtlı; onlarda yazılı kalır.",
    confirmDelete: "silinsin mi?",
    errName: "Ad gerekli (ya da bir Play linki ver).",
    errDate: "Tarih gerekli.", errAmount: "Tutar gerekli.",
    errSession: "Oturum düştü", errLogin: "Giriş başarısız",
    errThrottle: "(art arda denediysen 10 sn bekle)",
    fxFailed: "Kur alınamadı — yabancı para tutarları toplama dahil edilmedi.",
    fxStale: "güncellenemedi", fxUnconverted: "kayıt kursuz",
    dashPrompt: "Dashboard adresi"
  },
  en: {
    app: "Subscriptions", email: "Email", password: "Password", login: "Sign in",
    add: "+ Add", addShort: "Add", cards: "Cards", glance: "Glance", logout: "Sign out",
    lang: "Language", display: "Display",
    gross: "Monthly gross", cashback: "Cashback", net: "Monthly net", yearly: "Yearly net",
    f_link: "Link", f_name: "Name", f_amount: "Amount", f_unit: "Currency", f_cycle: "Cycle",
    f_date: "Date", f_cashbackF: "Cashback", f_card: "Card", f_category: "Category",
    f_status: "Status", f_notes: "Notes",
    c_monthly: "Monthly", c_yearly: "Yearly", c_quarterly: "Quarterly", c_weekly: "Weekly",
    s_active: "Active", s_paused: "Paused", s_cancelled: "Cancelled",
    k_software: "Software", k_media: "Media", k_games: "Games", k_cloud: "Cloud",
    k_finance: "Finance", k_health: "Health", k_learning: "Learning", k_other: "Other",
    save: "Save", cancel: "Cancel", del: "Delete", close: "Close", new: "New",
    titleNew: "New subscription", titleEdit: "Edit",
    saving: "Saving…", fetching: "Fetching…", loading: "Loading…",
    emptyList: "Nothing here yet.", emptyHint: "to start.",
    loadFailed: "Could not load the list.", retry: "Try again",
    noCards: "No cards.", cardExists: "A card with that name already exists.",
    cardUsed: "subscriptions carry it; it stays written on them.",
    confirmDelete: "— delete it?",
    errName: "A name is required (or give a Play link).",
    errDate: "A date is required.", errAmount: "An amount is required.",
    errSession: "Session expired", errLogin: "Sign-in failed",
    errThrottle: "(wait 10s if you retried quickly)",
    fxFailed: "No rates — foreign amounts were left out of the totals.",
    fxStale: "not refreshed", fxUnconverted: "record(s) without a rate",
    dashPrompt: "Dashboard address"
  }
}

let lang = localStorage.getItem("subs_lang") ||
  ((navigator.language || "en").toLowerCase().startsWith("tr") ? "tr" : "en")
// The display base only changes what the totals are quoted in; each row keeps
// the currency it is actually charged in, which is the fact, not a conversion.
let base = localStorage.getItem("subs_base") || "TRY"

const t = k => (I18N[lang] && I18N[lang][k]) || I18N.tr[k] || k
const SYMBOL = { TRY: "₺", USD: "$", EUR: "€", GBP: "£" }

function applyLang() {
  document.documentElement.lang = lang
  document.title = t("app")
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.getAttribute("data-i18n"))
  })
}

let token = localStorage.getItem("subs_token") || ""
let items = []
let fx = null          // TRY per one unit of each currency, or null when unavailable
let editing = null
let fxMeta = { date: null, stale: false }
const PER_PAGE = 8
let page = 1
let cards = []

const $ = id => document.getElementById(id)
const locale = () => (lang === "tr" ? "tr-TR" : "en-US")
const fmt = (n, digits = 0) =>
  new Intl.NumberFormat(locale(), { maximumFractionDigits: digits }).format(n)

// A TRY figure rendered in whichever currency is on display. Rates are TRY per
// one unit, so dividing converts; TRY divides by one and is unchanged.
function inBase(tryValue) {
  if (base === "TRY") return tryValue
  if (!fx || !fx[base]) return null
  return tryValue / fx[base]
}
const money = tryValue => {
  const v = inBase(tryValue)
  return v === null ? "—" : `${fmt(v, base === "TRY" ? 0 : 2)} ${SYMBOL[base]}`
}

// Every field below reaches innerHTML, and `name` can arrive from a Google Play
// listing's og:title rather than from this browser. Unescaped, a crafted title
// would run script on this origin - where a superuser token sits in
// localStorage. Escape at the point of interpolation, without exception.
const ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ESCAPES[c])

async function api(url, opts = {}) {
  const res = await fetch(url, {
    ...opts,
    headers: { "Content-Type": "application/json", "Authorization": token, ...(opts.headers || {}) }
  })
  if (res.status === 401 || res.status === 403) { logout(); throw new Error(t("errSession")) }
  const body = res.status === 204 ? null : await res.json()
  if (!res.ok) throw new Error(body?.message || ("HTTP " + res.status))
  return body
}

function logout() {
  token = ""
  localStorage.removeItem("subs_token")
  $("app").classList.add("hidden")
  $("login").classList.remove("hidden")
}

async function login() {
  $("loginErr").textContent = ""
  try {
    const res = await fetch(API + "/api/collections/_superusers/auth-with-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ identity: $("email").value.trim(), password: $("password").value })
    })
    const body = await res.json()
    if (!res.ok) throw new Error(body?.message || t("errLogin"))
    token = body.token
    localStorage.setItem("subs_token", token)
    // Kept only to draw the avatar's initial; the token is what authenticates.
    localStorage.setItem("subs_email", $("email").value.trim())
    $("password").value = ""
    start()
  } catch (err) {
    // The edge rate-limits /api/collections/_superusers* at 5 requests per 10s,
    // so a burst of retries looks like a credential failure. Say so.
    $("loginErr").textContent = err.message + " " + t("errThrottle")
  }
}

// Rates come from our own /api/subs/rates, not from the browser reaching an FX
// API directly: Yahoo sends no CORS headers, and a second source would let this
// page and the dashboard disagree about the same total. The same call rolls any
// passed charge date forward, which is why it runs before the list loads.
async function loadFx() {
  try {
    const body = await api(API + "/api/subs/rates")
    fx = body.rates
    fxMeta = { date: body.date || null, stale: !!body.stale }
  } catch (err) {
    fx = null
    fxMeta = { date: null, stale: true }
  }
}

const rate = n => new Intl.NumberFormat(locale(), { minimumFractionDigits: 2,
                                                   maximumFractionDigits: 2 }).format(n)

// The rates themselves, not just their provenance: seeing 48,44 is what tells
// you whether a total looks right.
function renderFx(unknown) {
  if (!fx) {
    $("fxNote").innerHTML = `<span class="warn">${esc(t("fxFailed"))}</span>`
    return
  }
  // Quoted against the display base, so switching to USD does not leave a row
  // of lira prices underneath dollar totals.
  const chips = ["TRY", "USD", "EUR", "GBP"]
    .filter(c => c !== base && fx[c] && fx[base])
    .map(c => `<span class="fx"><span class="sym">${SYMBOL[c]}</span><span class="dot">•</span>` +
              `<span class="val">${rate(fx[c] / fx[base])} ${SYMBOL[base]}</span></span>`)

  const meta = []
  if (fxMeta.date) meta.push(fxMeta.date)
  if (unknown) meta.push(`${unknown} ${t("fxUnconverted")}`)
  const warn = fxMeta.stale ? `<span class="warn">${esc(t("fxStale"))}</span>` : ""

  $("fxNote").innerHTML = chips.join("") +
    `<span class="meta">${warn}${warn && meta.length ? " · " : ""}${esc(meta.join(" · "))}</span>`
}

// Rates are TRY per one unit of the currency.
const toTRY = (amount, cur) =>
  cur === "TRY" ? amount : (fx && fx[cur] ? amount * fx[cur] : null)

async function loadCards() {
  const body = await api(CARDS + "?perPage=200&sort=name")
  cards = body.items
  fillCardSelect()
  renderCards()
}

// The select is rebuilt from the collection, so a card renamed in one place
// cannot linger as a stale spelling in the other.
function fillCardSelect(keep) {
  const sel = $("f_payment_method")
  sel.innerHTML = `<option value="">—</option>` +
    cards.map(c => `<option>${esc(c.name)}</option>`).join("")
  if (keep) {
    // A value saved before this card list existed still has to be selectable.
    if (!cards.some(c => c.name === keep)) {
      sel.insertAdjacentHTML("beforeend", `<option>${esc(keep)}</option>`)
    }
    sel.value = keep
  }
}

function renderCards() {
  $("cardList").innerHTML = cards.length
    ? cards.map(c => `<div class="row" data-card="${esc(c.id)}">
        <div class="meta"><b>${esc(c.name)}</b></div>
        <button class="danger" data-del="${esc(c.id)}">${esc(t("del"))}</button>
      </div>`).join("")
    : `<p class="empty">${esc(t("noCards"))}</p>`
  $("cardList").querySelectorAll("[data-del]").forEach(b =>
    b.onclick = () => removeCard(b.dataset.del))
}

async function addCard() {
  const name = $("f_newcard").value.trim()
  $("cardsErr").textContent = ""
  if (!name) return
  try {
    await api(CARDS, { method: "POST", body: JSON.stringify({ name }) })
    $("f_newcard").value = ""
    await loadCards()
  } catch (err) {
    $("cardsErr").textContent = /unique|validation/i.test(err.message)
      ? t("cardExists") : err.message
  }
}

async function removeCard(id) {
  const card = cards.find(c => c.id === id)
  // Removing a card leaves it on the subscriptions that already carry it: the
  // field is text, and silently blanking a payment method would lose data.
  const used = items.filter(i => i.payment_method === (card && card.name)).length
  const warn = used ? `\n\n${used} ${t("cardUsed")}` : ""
  if (!confirm(`"${card ? card.name : id}" ${t("confirmDelete")}${warn}`)) return
  try {
    await api(`${CARDS}/${id}`, { method: "DELETE" })
    await loadCards()
  } catch (err) {
    $("cardsErr").textContent = err.message
  }
}

function render() {
  let gross = 0, cash = 0, unknown = 0

  // Totals are computed over every subscription, not over the visible page -
  // a monthly cost that changes when you turn the page would be worthless.
  for (const s of items) {
    if (s.status !== "active") continue
    const amtTRY = toTRY(s.amount, s.currency)
    if (amtTRY === null) { unknown++; continue }
    const per = CYCLE_MONTHS[s.cycle] || 1
    gross += amtTRY / per
    cash += (toTRY(s.cashback || 0, s.currency) || 0) / per
  }

  const pages = Math.max(1, Math.ceil(items.length / PER_PAGE))
  if (page > pages) page = pages
  const visible = items.slice((page - 1) * PER_PAGE, page * PER_PAGE)

  const html = visible.map(s => {
    const logo = s.logo_url
      ? `<img src="${esc(s.logo_url)}" alt="" loading="lazy" onerror="this.removeAttribute('src')">`
      : `<img alt="">`
    const sub = [cycleName(s.cycle), s.next_charge ? s.next_charge.substring(0,10) : null,
                 s.payment_method, categoryName(s.category)].filter(Boolean).map(esc).join(" · ")
    const cb = s.cashback ? `<small>−${fmt(s.cashback)} cashback</small>` : ""
    return `<div class="row ${s.status !== "active" ? "off" : ""}" data-id="${esc(s.id)}">
      ${logo}
      <div class="meta"><b>${esc(s.name)}</b><small>${sub}</small></div>
      <div class="amt"><b>${fmt(s.amount)} ${esc(s.currency)}</b>${cb}</div>
    </div>`
  }).join("")

  $("list").innerHTML = html ||
    `<p class="empty">${esc(t("emptyList"))}<br><b>${esc(t("add"))}</b> ${esc(t("emptyHint"))}</p>`
  $("list").querySelectorAll(".row").forEach(el =>
    el.onclick = () => openDialog(items.find(i => i.id === el.dataset.id)))

  $("tGross").textContent = money(gross)
  $("tCash").textContent = cash ? "−" + money(cash) : "—"
  $("tNet").textContent = money(gross - cash)
  $("tYear").textContent = money((gross - cash) * 12)
  renderFx(unknown)

  $("pager").classList.toggle("hidden", pages < 2)
  $("pageInfo").textContent = `${page} / ${pages}`
  $("prevBtn").disabled = page <= 1
  $("nextBtn").disabled = page >= pages
}

function turnPage(delta) {
  page += delta
  render()
  window.scrollTo({ top: 0, behavior: "smooth" })
}

function openDialog(item) {
  editing = item || null
  $("dlgTitle").textContent = t(item ? "titleEdit" : "titleNew")
  $("delBtn").classList.toggle("hidden", !item)
  $("dlgErr").textContent = ""
  for (const f of FIELDS) {
    const el = $("f_" + f)
    let v = item ? (item[f] ?? "") : ""
    if (f === "next_charge" && v) v = String(v).substring(0, 10)
    if (!item) {
      if (f === "status") v = "active"
      if (f === "cycle") v = "monthly"
      if (f === "currency") v = "TRY"
    }
    if (f === "payment_method") fillCardSelect(v)
    else el.value = v
  }

  const logo = item && item.logo_url
  $("logoPreview").classList.toggle("hidden", !logo)
  if (logo) $("logoImg").src = logo

  $("dlg").showModal()
  if (!item) setTimeout(() => $("f_vendor_url").focus(), 60)
}

async function save() {
  $("dlgErr").textContent = ""
  const data = {}
  for (const f of FIELDS) data[f] = $("f_" + f).value
  data.amount = parseFloat(data.amount || 0)
  data.cashback = parseFloat(data.cashback || 0)

  // Name may be blank when a Play link can supply it; the server fills it in.
  const playLink = data.vendor_url.indexOf("play.google.com") !== -1
  if (!data.name && !playLink) { $("dlgErr").textContent = t("errName"); return }
  if (!data.next_charge) { $("dlgErr").textContent = t("errDate"); return }
  if (!data.amount) { $("dlgErr").textContent = t("errAmount"); return }

  $("saveBtn").disabled = true
  $("saveBtn").textContent = t(playLink && !data.name ? "fetching" : "saving")
  try {
    await api(editing ? `${COL}/${editing.id}` : COL, {
      method: editing ? "PATCH" : "POST",
      body: JSON.stringify(data)
    })
    $("dlg").close()
    await load()
  } catch (err) {
    $("dlgErr").textContent = err.message
  } finally {
    $("saveBtn").disabled = false
    $("saveBtn").textContent = t("save")
  }
}

async function remove() {
  if (!editing || !confirm(`"${editing.name}" ${t("confirmDelete")}`)) return
  try {
    await api(`${COL}/${editing.id}`, { method: "DELETE" })
    $("dlg").close()
    await load()
  } catch (err) {
    $("dlgErr").textContent = err.message
  }
}

async function load() {
  const body = await api(COL + "?perPage=500&sort=status,next_charge")
  items = body.items
  render()
}

async function start() {
  $("login").classList.add("hidden")
  $("app").classList.remove("hidden")
  $("list").innerHTML = `<p class="empty">${esc(t("loading"))}</p>`

  await loadFx()
  try { await loadCards() } catch (err) { console.error(err) }

  // A failed load used to leave an empty panel and put the reason in the
  // console, which reads as "my data is gone". Say what happened instead.
  try {
    await load()
  } catch (err) {
    console.error(err)
    $("list").innerHTML =
      `<p class="empty">${esc(t("loadFailed"))}<br><b>${esc(err.message)}</b>` +
      `<br><br><button id="retryBtn">${esc(t("retry"))}</button></p>`
    const retry = $("retryBtn")
    if (retry) retry.onclick = () => start()
  }
  // ?add=1 is how the Glance widget's "+ Ekle" link lands straight on the form.
  if (new URLSearchParams(location.search).get("add")) {
    history.replaceState(null, "", location.pathname)
    openDialog(null)
  }
}

$("loginBtn").onclick = login
$("password").onkeydown = e => { if (e.key === "Enter") login() }
$("logoutBtn").onclick = logout
$("addBtn").onclick = () => openDialog(null)
$("saveBtn").onclick = save
$("delBtn").onclick = remove
$("cancelBtn").onclick = () => $("dlg").close()
$("cardsBtn").onclick = () => { $("cardsErr").textContent = ""; $("cardsDlg").showModal() }
$("cardsClose").onclick = () => { $("cardsDlg").close(); fillCardSelect($("f_payment_method").value) }
$("cardAdd").onclick = addCard

const menu = $("menu")
const closeMenu = () => {
  menu.classList.add("hidden")
  $("avatarBtn").setAttribute("aria-expanded", "false")
}
$("langSel").value = lang
$("baseSel").value = base
$("langSel").onchange = e => {
  lang = e.target.value
  localStorage.setItem("subs_lang", lang)
  applyLang()
  // Re-render rather than reload: the cycle names, totals and empty states are
  // all produced in JS and would otherwise keep the previous language.
  if (items.length || fx) { renderCards(); render() }
}
$("baseSel").onchange = e => {
  base = e.target.value
  localStorage.setItem("subs_base", base)
  render()
}
// Clicks inside the menu must not reach the document listener that closes it,
// or picking a language would shut the menu on the way.
menu.addEventListener("click", e => e.stopPropagation())

applyLang()

$("avatarBtn").onclick = (e) => {
  e.stopPropagation()
  const open = menu.classList.toggle("hidden")
  $("avatarBtn").setAttribute("aria-expanded", open ? "false" : "true")
}
document.addEventListener("click", closeMenu)
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu() })
menu.querySelectorAll("button").forEach(b => b.addEventListener("click", closeMenu))

// A session that predates the stored address has no initial to show, so fall
// back to a glyph rather than rendering a literal question mark.
const initial = (localStorage.getItem("subs_email") || "").trim().charAt(0).toUpperCase()
$("avatarBtn").innerHTML = initial ||
  `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" style="vertical-align:-3px">
     <circle cx="12" cy="8" r="3.5"></circle>
     <path d="M4.5 20c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6"></path>
   </svg>`
// The dashboard is optional and its address is nobody's business but yours, so
// it is a stored setting rather than a baked-in URL. Unset, the entry is hidden;
// clicking it the first time is how you set it.
let dash = localStorage.getItem("subs_dash") || ""
function applyDash() {
  $("dashBtn").classList.toggle("hidden", !dash)
}
$("dashBtn").onclick = () => {
  if (dash) { location.href = dash; return }
  const entered = prompt(t("dashPrompt"), "https://")
  if (!entered) return
  dash = entered.trim()
  localStorage.setItem("subs_dash", dash)
  applyDash()
}
applyDash()
$("prevBtn").onclick = () => turnPage(-1)
$("nextBtn").onclick = () => turnPage(1)
$("f_newcard").onkeydown = e => { if (e.key === "Enter") addCard() }

// Live preview, so a pasted image URL is confirmed before saving rather than
// after - a broken link is otherwise only visible once it is already stored.
function previewLogo() {
  const url = $("f_vendor_url").value.trim()
  // Only a direct image can be previewed here; a page URL is resolved server
  // side on save, so there is nothing honest to show for it yet.
  const isImage = /\.(png|jpe?g|webp|svg|gif|avif)(\?|#|$)/i.test(url) && !/File:/i.test(url)
  if (isImage) { $("logoImg").src = url; $("logoPreview").classList.remove("hidden") }
}
$("f_vendor_url").oninput = previewLogo

if (token) start(); else $("login").classList.remove("hidden")
</script>
</body>
</html>
