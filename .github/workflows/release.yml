name: release

# Tag push (v0.1.3) publishes to npm with OIDC trusted publishing — no token.
# One-time setup on npmjs.com: package → Settings → Trusted publisher → GitHub
# Actions → burakboduroglu/skadi, workflow release.yml.
# `npm publish` runs `prepack`, so the tarball always carries a fresh
# pb_public/subs build; nothing generated is committed to git.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
        working-directory: web
      - name: tag matches package version
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME != package.json version"
            exit 1
          }
      - run: npm publish --provenance --access public
